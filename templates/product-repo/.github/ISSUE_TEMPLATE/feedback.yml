name: Feedback
description: Tell us how the product worked for you (anonymous; no personal details)
title: "[FEEDBACK] "
labels: ["type:feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the product. This form is anonymous by design (ADR 0012).
        Please do not include personal details or contact details of anyone, including yourself.
        Testers without a GitHub account can use the in-product Feedback link, which may point to a survey instead.
  - type: dropdown
    id: rating
    attributes:
      label: Overall rating
      description: 1 = very poor, 5 = excellent.
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      placeholder: "For example: create my first list and share it."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: What worked, what did not, and anything that surprised you.
    validations:
      required: true

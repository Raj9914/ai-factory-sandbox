name: preview
# Per-PR preview deployment to Cloudflare Pages (ADR 0011).
# Builds the PR head commit, deploys dist/ to the Pages branch `pr-<number>`, runs
# `make smoke` against the preview, records a GitHub Deployment (environment "preview")
# and keeps one PR comment up to date with the URL, commit SHA and smoke result.
# The `screenshots` job then captures every routed screen in design/screens.yml at its
# viewport (scripts/screenshots.mjs), uploads the PNGs as an artifact and keeps a second
# PR comment with a table linking each screenshot to its Figma frame.
#
# Security: runs on the plain `pull_request` event only (never the _target variant), and only for branches
# in this repository; fork PRs skip the job, so they never reach the `preview` environment
# or its secrets. Cloudflare credentials are `preview` Environment secrets and are passed
# to the deploy step only. See README.md "Preview deployments" for setup.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  deployments: write
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # Same-repository PRs only (skip forks), and only once the product has a Pages project.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      WRANGLER_VERSION: "4.20.0"   # pinned Wrangler release; bump deliberately
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # deploy exactly the PR head commit
          persist-credentials: false
      # Add the same pinned (full commit SHA) setup actions as ci.yml for the product's stack.
      - run: make install
      - run: make test
      - run: make build

      - name: Record GitHub Deployment
        id: deployment
        run: |
          set -euo pipefail
          id="$(jq -n --arg ref "$HEAD_SHA" --arg desc "Preview for PR #$PR_NUMBER" \
            '{ref: $ref, environment: "preview", auto_merge: false, required_contexts: [],
              transient_environment: true, production_environment: false, description: $desc}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/deployments/$id/statuses" -f state=in_progress \
            -f log_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Deploy dist/ to Cloudflare Pages (branch pr-<number>)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::CLOUDFLARE_PAGES_PROJECT must be a Pages project name (a-z, 0-9, -)"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] \
            || { echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the 'preview' environment"; exit 1; }
          [ -d dist ] || { echo "::error::make build must produce dist/"; exit 1; }
          branch="pr-$PR_NUMBER"
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist \
            --project-name "$PAGES_PROJECT" --branch "$branch" \
            --commit-hash "$HEAD_SHA" --commit-message "PR #$PR_NUMBER" --commit-dirty=true \
            | tee wrangler-output.txt
          alias_url="https://$branch.$PAGES_PROJECT.pages.dev"
          # The unique deployment URL serves exactly this commit; the branch alias always
          # points at the latest deploy of this PR and is the shareable link.
          deploy_url="$(grep -oE "https://[a-z0-9-]+\.$PAGES_PROJECT\.pages\.dev" wrangler-output.txt \
            | grep -vxF "$alias_url" | sed -n 1p || true)"
          echo "url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=${deploy_url:-$alias_url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the preview
        id: smoke
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: make smoke URL="$SMOKE_URL"

      - name: Update GitHub Deployment status
        if: always() && steps.deployment.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          SMOKE: ${{ steps.smoke.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE" = success ]; then state=success
          elif [ "$DEPLOY" = success ]; then state=failure
          else state=error; fi
          args=(-f state="$state" -f log_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
                -f description="smoke: $SMOKE")
          [ -z "$PREVIEW_URL" ] || args+=(-f environment_url="$PREVIEW_URL")
          gh api "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" "${args[@]}" >/dev/null

      - name: Upsert PR comment (URL, SHA, smoke result)
        if: always()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          marker="<!-- ship48-preview -->"
          case "$SMOKE" in
            success) smoke="pass" ;;
            failure) smoke="fail" ;;
            *) smoke="not run (deploy did not complete)" ;;
          esac
          body="$marker
          ### Preview deployment
          | | |
          |---|---|
          | URL | ${PREVIEW_URL:-not deployed} |
          | This commit | ${DEPLOYMENT_URL:-not deployed} |
          | SHA | \`$HEAD_SHA\` |
          | smoke | **smoke: $smoke** |
          | Run | $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID |"
          ids="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  screenshots:
    # Runs only after a successful deploy + smoke of this PR's preview (same-repo PRs only,
    # inherited from `preview`). No secrets: the browser gets only the public preview URL.
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: "1.56.1"   # pinned Playwright release; bump deliberately
      PREVIEW_URL: ${{ needs.preview.outputs.deployment_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SCREENSHOT_TIMEOUT_MS: "30000"   # per screen (navigation + screenshot)
      SCREENSHOT_BUDGET_MS: "420000"   # whole capture step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check for design/screens.yml
        id: spec
        run: |
          if [ -f design/screens.yml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No design/screens.yml; no screenshots to capture"; echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install pinned Playwright Chromium
        if: steps.spec.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          npx --no-install playwright install --with-deps chromium

      - name: Capture screenshots at spec viewports
        id: capture
        if: steps.spec.outputs.present == 'true'
        run: node scripts/screenshots.mjs "$PREVIEW_URL" design/screens.yml screenshots/

      - name: Upload screenshots artifact
        id: upload
        if: always() && steps.spec.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-screenshots-pr-${{ github.event.pull_request.number }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upsert PR comment (screenshot table)
        if: always() && steps.spec.outputs.present == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const workspace = process.env.GITHUB_WORKSPACE;
            const { buildComment, MARKER } = await import(
              pathToFileURL(path.join(workspace, 'scripts', 'screenshots.mjs')).href);
            let manifest = null;
            try {
              manifest = JSON.parse(fs.readFileSync(path.join(workspace, 'screenshots', 'screens.json'), 'utf8'));
            } catch (error) {
              core.warning(`No screenshot manifest: ${error.message}`);
            }
            const body = buildComment(manifest, {
              artifactUrl: process.env.ARTIFACT_URL || '',
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              sha: process.env.HEAD_SHA,
            });
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user && c.user.login === 'github-actions[bot]'
              && typeof c.body === 'string' && c.body.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

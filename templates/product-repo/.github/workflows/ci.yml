name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:                       # required status check name: "test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Add pinned (full commit SHA) setup actions for the product's stack here,
      # e.g. setup-node or setup-python. Never use a tag or branch reference.
      # Offline design record check: every screen in design/screens.yml needs a Figma URL,
      # node id, version and state coverage. Passes when no inventory exists yet.
      - run: python3 scripts/validate_design_records.py design/screens.yml
      - run: make install
      - run: make test

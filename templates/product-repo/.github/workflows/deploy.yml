name: deploy
# Staging and production deployment to Cloudflare Pages (ADR 0011,
# docs/runbooks/DEPLOYMENT_AND_ROLLBACK.md in the factory repository).
#   push to main        -> staging
#   workflow_dispatch   -> production by default (staging selectable); run it from main
#   workflow_call       -> used by rollback.yml to redeploy an earlier commit
# Each run builds the commit, records a GitHub Deployment for it, deploys dist/ with a pinned
# Wrangler, runs `make smoke` against the new deployment and sets the Deployment status to
# success or failure. The job uses the GitHub Environment `staging` or `production`; the
# `production` environment has a required reviewer, so GitHub holds every production deploy
# (and production rollback) until a human approves it. Cloudflare credentials are environment
# secrets and are passed to the deploy step only.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (production waits for human approval)"
        required: true
        default: production
        type: choice
        options: [production, staging]
  workflow_call:
    inputs:
      environment:
        description: "staging or production"
        required: true
        type: string
      sha:
        description: "Full commit SHA to deploy"
        required: true
        type: string
      rollback_from:
        description: "Commit being rolled back (recorded in the Deployment payload)"
        required: false
        default: ""
        type: string
    outputs:
      url:
        description: "Environment URL"
        value: ${{ jobs.deploy.outputs.url }}
      sha:
        description: "Deployed commit SHA"
        value: ${{ jobs.deploy.outputs.sha }}
      smoke:
        description: "Smoke step outcome (success, failure, skipped)"
        value: ${{ jobs.deploy.outputs.smoke }}
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    # Pushes are skipped until the product has a Pages project; manual runs fail loudly instead.
    if: github.event_name != 'push' || vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false   # never cancel a deploy half-way
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      sha: ${{ steps.target.outputs.sha }}
      smoke: ${{ steps.smoke.outcome }}
    env:
      WRANGLER_VERSION: "4.20.0"   # pinned Wrangler release; bump deliberately (same as preview.yml)
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH || 'main' }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
      ROLLBACK_FROM: ${{ inputs.rollback_from || '' }}
      RUN_REF: ${{ github.ref }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check target
        id: target
        run: |
          set -euo pipefail
          [ "$RUN_REF" = refs/heads/main ] || { echo "::error::deploy and rollback run from main only (got $RUN_REF)"; exit 1; }
          case "$DEPLOY_ENV" in staging|production) ;; *) echo "::error::environment must be staging or production"; exit 1 ;; esac
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          [ -z "$ROLLBACK_FROM" ] || [[ "$ROLLBACK_FROM" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::rollback_from must be a full commit SHA"; exit 1; }
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $DEPLOY_SHA to $DEPLOY_ENV${ROLLBACK_FROM:+ (rollback from $ROLLBACK_FROM)}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}   # deploy exactly this commit
          persist-credentials: false
      # Add the same pinned (full commit SHA) setup actions as ci.yml for the product's stack.
      - run: make install
      - run: make test
      - run: make build

      - name: Record GitHub Deployment
        id: deployment
        run: |
          set -euo pipefail
          if [ -n "$ROLLBACK_FROM" ]; then
            desc="Rollback of $ROLLBACK_FROM"; payload="$(jq -n --arg from "$ROLLBACK_FROM" '{rollback_from: $from}')"
          else
            desc="Deploy to $DEPLOY_ENV"; payload='{}'
          fi
          id="$(jq -n --arg ref "$DEPLOY_SHA" --arg env "$DEPLOY_ENV" --arg desc "$desc" --argjson payload "$payload" \
            '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [], payload: $payload,
              transient_environment: false, production_environment: ($env == "production"), description: $desc}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/deployments/$id/statuses" -f state=in_progress \
            -f log_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Deploy dist/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::Set the repository variable CLOUDFLARE_PAGES_PROJECT to the Pages project name (a-z, 0-9, -)"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] \
            || { echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the '$DEPLOY_ENV' environment"; exit 1; }
          [ -d dist ] || { echo "::error::make build must produce dist/"; exit 1; }
          if [ "$DEPLOY_ENV" = production ]; then
            branch="$PRODUCTION_BRANCH"; alias_url="${PRODUCTION_URL:-https://$PAGES_PROJECT.pages.dev}"
          else
            branch=staging; alias_url="${STAGING_URL:-https://staging.$PAGES_PROJECT.pages.dev}"
          fi
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::CLOUDFLARE_PRODUCTION_BRANCH is not a valid branch name"; exit 1; }
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist \
            --project-name "$PAGES_PROJECT" --branch "$branch" \
            --commit-hash "$DEPLOY_SHA" --commit-message "$DEPLOY_ENV ${DEPLOY_SHA:0:12}" --commit-dirty=true \
            | tee wrangler-output.txt
          # The unique deployment URL serves exactly this commit; the alias is what users see.
          deploy_url="$(grep -oE "https://[a-z0-9-]+\.$PAGES_PROJECT\.pages\.dev" wrangler-output.txt \
            | grep -vxF "https://$PAGES_PROJECT.pages.dev" | grep -vxF "https://$branch.$PAGES_PROJECT.pages.dev" \
            | sed -n 1p || true)"
          echo "url=${alias_url%/}" >> "$GITHUB_OUTPUT"
          echo "deployment_url=${deploy_url:-${alias_url%/}}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployment
        id: smoke
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: make smoke URL="$SMOKE_URL"

      - name: Update GitHub Deployment status
        if: always() && steps.deployment.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          ENV_URL: ${{ steps.deploy.outputs.url }}
          SMOKE: ${{ steps.smoke.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE" = success ]; then state=success
          elif [ "$DEPLOY" = success ]; then state=failure
          else state=error; fi
          args=(-f state="$state" -f log_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
                -f description="smoke: $SMOKE")
          [ -z "$ENV_URL" ] || args+=(-f environment_url="$ENV_URL")
          gh api "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" "${args[@]}" >/dev/null
          {
            echo "### Deployment: $DEPLOY_ENV"
            echo "| | |"
            echo "|---|---|"
            echo "| SHA | \`$DEPLOY_SHA\` |"
            echo "| URL | ${ENV_URL:-not deployed} |"
            echo "| Deployment status | $state |"
            echo "| smoke | $SMOKE |"
            [ -z "$ROLLBACK_FROM" ] || echo "| Rolled back from | \`$ROLLBACK_FROM\` |"
          } >> "$GITHUB_STEP_SUMMARY"

name: factory-docs
on:
  pull_request:
    paths: ["skills/**", ".agents/skills/**", ".claude/skills/**", "chatgpt-plugin/skills/**", "docs/**", "scripts/**", "CLAUDE.md", "AGENTS.md", "README.md", ".github/**", "pyproject.toml", ".ai-factory.yaml"]
  push:
    branches: [main]
    paths: ["skills/**", ".agents/skills/**", ".claude/skills/**", "chatgpt-plugin/skills/**", "docs/**", "scripts/**", "CLAUDE.md", "AGENTS.md", "README.md", ".github/**", "pyproject.toml", ".ai-factory.yaml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/validate_factory.py
      - run: python scripts/sync_skills.py --check

name: factory-docs
on:
  pull_request:
    paths: ["skills/**", ".agents/skills/**", ".claude/skills/**", "chatgpt-plugin/skills/**", "docs/**", "scripts/**", "CLAUDE.md", "AGENTS.md", "README.md", ".github/**", "pyproject.toml", ".ai-factory.yaml"]
  push:
    branches: [main]
    paths: ["skills/**", ".agents/skills/**", ".claude/skills/**", "chatgpt-plugin/skills/**", "docs/**", "scripts/**", "CLAUDE.md", "AGENTS.md", "README.md", ".github/**", "pyproject.toml", ".ai-factory.yaml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/validate_factory.py
      - run: python scripts/sync_skills.py --check

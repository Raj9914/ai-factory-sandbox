name: ci
on:
  pull_request:
    # labeled/unlabeled re-run the test-integrity check when
    # `test-change-approved` is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:                       # required status check name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install pip-audit && python -m pip_audit   # fails on known vulnerabilities
      - run: python -m pytest -q

  template-screenshots:       # issue #41: real Playwright run of the template's screenshot script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/product-repo
    env:
      PLAYWRIGHT_VERSION: "1.56.1"   # keep equal to templates/product-repo/.github/workflows/preview.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          npx --no-install playwright install --with-deps chromium
      - name: Serve a static fixture site on localhost:4173
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/signup"
          printf '<!doctype html><title>Home</title><h1>Home</h1><p>Template example</p>\n' > "$site/index.html"
          printf '<!doctype html><title>Sign up</title><h1>Sign up</h1><form><input aria-label="Code"></form>\n' > "$site/signup/index.html"
          nohup python3 -m http.server 4173 --directory "$site" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4173/ && exit 0; sleep 0.5; done
          cat "$RUNNER_TEMP/http.log"; exit 1
      - name: Capture the example screens (issue verification command)
        run: |
          set -euo pipefail
          node scripts/screenshots.mjs http://localhost:4173 design/screens.yml out/
          count="$(ls out/*.png | wc -l)"
          echo "png files: $count"
          [ "$count" -ge 4 ]
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: template-screenshots
          path: templates/product-repo/out/
          if-no-files-found: warn
          retention-days: 7

  test-integrity:             # fails if tests are deleted or skipped without owner approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Check test integrity
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Run the checker from the base branch so a PR cannot weaken the
          # checker that judges it. Falls back to the PR copy only when the
          # base branch does not have the script yet (first introduction).
          checker="$RUNNER_TEMP/check_test_integrity.py"
          if ! git show "$BASE_SHA:scripts/check_test_integrity.py" > "$checker" 2>/dev/null; then
            cp scripts/check_test_integrity.py "$checker"
          fi
          python "$checker" "$BASE_SHA" "$HEAD_SHA"

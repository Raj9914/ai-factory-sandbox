name: ci
on:
  pull_request:
    # labeled/unlabeled re-run the test-integrity check when
    # `test-change-approved` is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:                       # required status check name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install pip-audit && python -m pip_audit   # fails on known vulnerabilities
      - run: python -m pytest -q

  test-integrity:             # fails if tests are deleted or skipped without owner approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Check test integrity
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Run the checker from the base branch so a PR cannot weaken the
          # checker that judges it. Falls back to the PR copy only when the
          # base branch does not have the script yet (first introduction).
          checker="$RUNNER_TEMP/check_test_integrity.py"
          if ! git show "$BASE_SHA:scripts/check_test_integrity.py" > "$checker" 2>/dev/null; then
            cp scripts/check_test_integrity.py "$checker"
          fi
          python "$checker" "$BASE_SHA" "$HEAD_SHA"

name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "staging or production"
        required: true
        default: staging
        type: choice
        options: [staging, production]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The GitHub Environment gates this job. "production" has required reviewers,
    # so GitHub holds the run until a human approves it in the Actions UI.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Deploy (sandbox, no real target)
        run: |
          echo "Deploying $(git rev-parse --short HEAD) to ${{ inputs.environment }}"
